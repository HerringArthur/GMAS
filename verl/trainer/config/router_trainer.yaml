defaults:
  - ppo_trainer
  - _self_

agent:
  orchestra_type: router
  agent_ids: ["Router Agent", "SOLVE", "VERIFY", "REVISE"]
  role_ids: ["SOLVE", "VERIFY", "REVISE"]
  model_ids: ["Qwen/Qwen3-4B", "Qwen/Qwen3-4B", "Qwen/Qwen3-4B", "Qwen/Qwen3-4B"]
  model_sharing: false
  use_agent_memory: false
  orchestra:
    router:
      max_loop_num: 4

env:
  env_name: math
  history_length: 2 # Search environments supply tool history through env_obs.

algorithm:
  adv_estimator: grpo
  group_by_agent_id: false
  credit_mode: router_subagent
